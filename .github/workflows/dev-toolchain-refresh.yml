name: Refresh development toolchain once
on:
  push:
    branches: [security/modernize-dev-tooling]
    paths: ['.github/workflows/dev-toolchain-refresh.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate compatible modern dependency lockfile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.devDependencies['@typescript-eslint/eslint-plugin'];
          delete pkg.devDependencies['@typescript-eslint/parser'];
          pkg.devDependencies['eslint'] = '^10.0.0';
          pkg.devDependencies['@eslint/js'] = '^10.0.0';
          pkg.devDependencies['typescript-eslint'] = '^8.0.0';
          pkg.devDependencies['vitest'] = '^5.0.5';
          pkg.devDependencies['vite'] = '^8.3.5';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          # Old Vitest 2 lock contains incompatible Vite 5 peer resolutions.
          rm -f package-lock.json
          npm install --ignore-scripts --no-audit --no-fund
          # Fixes low-severity esbuild vulnerability within tsup's compatible ^0.27 range.
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify all tests and compiled exports
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run bench -- -t 'short message'
      - name: Security audit including development dependencies
        run: npm audit --audit-level=low
      - name: Commit generated dependency metadata to working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(deps): upgrade Vitest and ESLint toolchain safely'
          git push origin HEAD:security/modernize-dev-tooling
